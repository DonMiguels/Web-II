getUsersProfiles:
  query: SELECT u.id AS user_id, u.name AS username, p.id AS profile_id, p.name AS profile_name FROM public."user" u JOIN public."user_profile" up ON u.id = up.user_id JOIN public."profile" p ON up.profile_id = p.id;
  structure_params: {}
  orderArray: []
registerUser:
  query: INSERT INTO public."user" (name, email, password_hash, is_solvency, person_id) VALUES ($1, (SELECT NULLIF(TRIM(address), '') FROM public.person WHERE id = $3), $2, TRUE, $3) RETURNING id, name AS username, person_id;
  structure_params:
    username: string
    password: string
    person_id: int
  orderArray:
    - username
    - password
    - person_id
getUserById:
  query: SELECT u.id AS usuario_id, u.name AS nombre, u.email, u.is_solvency AS tiene_solvencia, u.is_active AS esta_activo, u.person_id, p.first_name || ' ' || p.last_name AS nombre_completo, p.document_id AS documento, u.created_at, u.updated_at FROM public."user" u LEFT JOIN public.person p ON u.person_id = p.id WHERE u.id = $1 AND u.deleted_at IS NULL;
  structure_params:
    id: int
  orderArray:
    - id
updateUserPasswordByUsername:
  query: UPDATE public."user" SET password_hash = $1 WHERE name = $2 RETURNING id, name AS username;
  structure_params:
    password: string
    username: string
  orderArray:
    - password
    - username
countUserByEmail:
  query: SELECT COUNT(*) AS count FROM public."user" WHERE email = $1;
  structure_params:
    email: string
  orderArray:
    - email
countUserByUsername:
  query: SELECT COUNT(*) AS count FROM public."user" WHERE name = $1;
  structure_params:
    username: string
  orderArray:
    - username
getUser:
  query: SELECT u.id AS id, u.name AS username, u.password_hash AS password, u.email AS email, p.first_name AS name, p.last_name AS lastname, p.document_id AS ci FROM public."user" u LEFT JOIN public.person p ON u.person_id = p.id WHERE u.name = $1;
  structure_params:
    username: string
  orderArray:
    - username
getUserByEmail:
  query: SELECT u.id AS usuario_id, u.name AS nombre, u.email, u.is_solvency AS tiene_solvencia, u.is_active AS esta_activo, u.person_id, p.first_name || ' ' || p.last_name AS nombre_completo, p.document_id AS documento, u.created_at, u.updated_at FROM public."user" u LEFT JOIN public.person p ON u.person_id = p.id WHERE u.email = $1 AND u.deleted_at IS NULL;
  structure_params:
    email: string
  orderArray:
    - email
updateUserPassword:
  query: UPDATE public."user" SET password_hash = $1 WHERE id = $2 RETURNING id, name AS username;
  structure_params:
    password: string
    userId: int
  orderArray:
    - password
    - userId
insertPerson:
  query: INSERT INTO public.person (document_id, first_name, last_name, phone, address) VALUES ($1, $2, $3, $5, $4) RETURNING id AS person_id;
  structure_params:
    ci: string
    name: string
    lastname: string
    email: string
    phone: string
  orderArray:
    - ci
    - name
    - lastname
    - email
    - phone
getPersonsBasic:
  query: SELECT p.id AS id, p.document_id AS ci, CONCAT_WS(' ', p.first_name, p.last_name) AS nombre, COALESCE(NULLIF(TRIM(u.email), ''), NULLIF(TRIM(p.address), '')) AS correo, p.phone AS telefono, p.address AS direccion, CASE WHEN p.birth_date IS NULL THEN NULL ELSE EXTRACT(YEAR FROM AGE(CURRENT_DATE, p.birth_date))::INT END AS edad FROM public.person p LEFT JOIN public."user" u ON u.person_id = p.id AND u.deleted_at IS NULL WHERE p.deleted_at IS NULL ORDER BY p.first_name, p.last_name, p.id;
  structure_params: {}
  orderArray: []
insertUserProfile:
  query: INSERT INTO public.user_profile (user_id, profile_id) VALUES ($1, $2) RETURNING id AS user_profile_id;
  structure_params:
    user_id: int
    profile_id: int
  orderArray:
    - user_id
    - profile_id
getProfileByName:
  query: SELECT id AS profile_id, name AS profile_de FROM public.profile WHERE name = $1;
  structure_params:
    profile_name: string
  orderArray:
    - profile_name
insertProfile:
  query: INSERT INTO public.profile (name) VALUES ($1) RETURNING id AS profile_id, name AS profile_de;
  structure_params:
    profile_name: string
  orderArray:
    - profile_name
getPermissions:
  query: SELECT DISTINCT s.name AS subsystem, c.name AS class_name, m.name AS method_name, p.name AS profile_name FROM public.method_profile mp JOIN public.method m ON m.id = mp.method_id JOIN public.class_method cm ON cm.method_id = m.id JOIN public."class" c ON c.id = cm.class_id JOIN public.subsystem_class sc ON sc.class_id = c.id JOIN public.subsystem s ON s.id = sc.subsystem_id JOIN public.profile p ON p.id = mp.profile_id ORDER BY s.name, c.name, m.name, p.name;
  structure_params: {}
  orderArray: []
getTransactionRoutes:
  query: SELECT t.id AS transaction_id, s.name AS subsystem, c.name AS class_name, m.name AS method_name FROM public."transaction" t JOIN public.subsystem s ON s.id = t.subsystem_id JOIN public."class" c ON c.id = t.class_id JOIN public."method" m ON m.id = t.method_id ORDER BY t.id;
  structure_params: {}
  orderArray: []
ensureTransactionSerial:
  query: SELECT 1;
  structure_params: {}
  orderArray: []
insertPermission:
  query: WITH ins_subsystem AS (INSERT INTO public.subsystem (name) SELECT $1::text WHERE NOT EXISTS (SELECT 1 FROM public.subsystem WHERE name = $1::text) RETURNING id), sel_subsystem AS (SELECT id FROM ins_subsystem UNION ALL SELECT id FROM public.subsystem WHERE name = $1::text ORDER BY id LIMIT 1), ins_class AS (INSERT INTO public."class" (name) SELECT $2::text WHERE NOT EXISTS (SELECT 1 FROM public."class" WHERE name = $2::text) RETURNING id), sel_class AS (SELECT id FROM ins_class UNION ALL SELECT id FROM public."class" WHERE name = $2::text ORDER BY id LIMIT 1), link_subsystem_class AS (INSERT INTO public.subsystem_class (subsystem_id, class_id) SELECT s.id, c.id FROM sel_subsystem s CROSS JOIN sel_class c ON CONFLICT (subsystem_id, class_id) DO NOTHING), ins_method AS (INSERT INTO public."method" (name) SELECT $3::text WHERE NOT EXISTS (SELECT 1 FROM public."method" WHERE name = $3::text) RETURNING id), sel_method AS (SELECT id FROM ins_method UNION ALL SELECT id FROM public."method" WHERE name = $3::text ORDER BY id LIMIT 1), link_class_method AS (INSERT INTO public.class_method (class_id, method_id) SELECT c.id, m.id FROM sel_class c CROSS JOIN sel_method m ON CONFLICT (class_id, method_id) DO NOTHING), ins_profile AS (INSERT INTO public.profile (name) SELECT $4::text WHERE NOT EXISTS (SELECT 1 FROM public.profile WHERE name = $4::text) RETURNING id), sel_profile AS (SELECT id FROM ins_profile UNION ALL SELECT id FROM public.profile WHERE name = $4::text ORDER BY id LIMIT 1), link_method_profile AS (INSERT INTO public.method_profile (method_id, profile_id) SELECT m.id, p.id FROM sel_method m CROSS JOIN sel_profile p ON CONFLICT (method_id, profile_id) DO NOTHING), ins_transaction AS (INSERT INTO public."transaction" (subsystem_id, class_id, method_id) SELECT s.id, c.id, m.id FROM sel_subsystem s CROSS JOIN sel_class c CROSS JOIN sel_method m WHERE NOT EXISTS (SELECT 1 FROM public."transaction" t WHERE t.method_id = m.id AND t.class_id = c.id AND t.subsystem_id = s.id)) SELECT s.id AS subsystem_id, c.id AS class_id, m.id AS method_id, p.id AS profile_id FROM sel_subsystem s CROSS JOIN sel_class c CROSS JOIN sel_method m CROSS JOIN sel_profile p;
  structure_params:
    subsystem: string
    class_name: string
    method_name: string
    profile_name: string
  orderArray:
    - subsystem
    - class_name
    - method_name
    - profile_name
# ============================================================
# NEGOCIO: Item
# ============================================================
insertItem:
  query: INSERT INTO public.item (code, name, description, brand, model, category_id, condition_id, status_id, is_consumable, cost, acquisition_date) VALUES ($1, $2, NULLIF($3, ''), NULLIF($4, ''), NULLIF($5, ''), $6, NULLIF($7, 0), NULLIF($8, 0), $9, $10, NULLIF($11, '')::date) RETURNING *;
  structure_params:
    code: string
    name: string
    description: string
    brand: string
    model: string
    category_id: int
    condition_id: int
    status_id: int
    is_consumable: boolean
    cost: float
    acquisition_date: string
  orderArray:
    - code
    - name
    - description
    - brand
    - model
    - category_id
    - condition_id
    - status_id
    - is_consumable
    - cost
    - acquisition_date
updateItem:
  query: UPDATE public.item SET code = $2, name = $3, description = NULLIF($4, ''), brand = NULLIF($5, ''), model = NULLIF($6, ''), category_id = $7, condition_id = NULLIF($8, 0), status_id = NULLIF($9, 0), is_consumable = $10, cost = $11, acquisition_date = NULLIF($12, '')::date, updated_at = NOW() WHERE id = $1 AND deleted_at IS NULL RETURNING *;
  structure_params:
    id: int
    code: string
    name: string
    description: string
    brand: string
    model: string
    category_id: int
    condition_id: int
    status_id: int
    is_consumable: boolean
    cost: float
    acquisition_date: string
  orderArray:
    - id
    - code
    - name
    - description
    - brand
    - model
    - category_id
    - condition_id
    - status_id
    - is_consumable
    - cost
    - acquisition_date
softDeleteItem:
  query: UPDATE public.item SET deleted_at = NOW(), is_active = FALSE, updated_at = NOW() WHERE id = $1 AND deleted_at IS NULL RETURNING id, code, name, deleted_at;
  structure_params:
    id: int
  orderArray:
    - id
getItemById:
  query: SELECT i.*, c.name AS category_name, cond.name AS condition_name, s.name AS status_name FROM public.item i JOIN public.item_category c ON c.id = i.category_id LEFT JOIN public.item_condition cond ON cond.id = i.condition_id LEFT JOIN public.item_status s ON s.id = i.status_id WHERE i.id = $1 AND i.deleted_at IS NULL;
  structure_params:
    id: int
  orderArray:
    - id
getAllItems:
  query: SELECT i.*, c.name AS category_name, cond.name AS condition_name, s.name AS status_name FROM public.item i JOIN public.item_category c ON c.id = i.category_id LEFT JOIN public.item_condition cond ON cond.id = i.condition_id LEFT JOIN public.item_status s ON s.id = i.status_id WHERE i.deleted_at IS NULL ORDER BY i.id;
  structure_params: {}
  orderArray: []
getItemsByCategory:
  query: SELECT i.*, c.name AS category_name, cond.name AS condition_name, s.name AS status_name FROM public.item i JOIN public.item_category c ON c.id = i.category_id LEFT JOIN public.item_condition cond ON cond.id = i.condition_id LEFT JOIN public.item_status s ON s.id = i.status_id WHERE i.deleted_at IS NULL AND c.name = $1 ORDER BY i.id;
  structure_params:
    category_name: string
  orderArray:
    - category_name

