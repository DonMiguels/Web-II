getStockByLocation:
  query: SELECT st.*, i.code AS item_code, i.name AS item_name FROM public.stock st JOIN public.item i ON i.id = st.item_id WHERE st.location_id = $1 AND i.deleted_at IS NULL ORDER BY st.id;
  structure_params:
    location_id: int
  orderArray:
    - location_id

