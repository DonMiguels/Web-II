updateStock:
  query: UPDATE public.stock SET item_id = $2, location_id = $3, quantity = $4, updated_at = NOW() WHERE id = $1 RETURNING *;
  structure_params:
    id: int
    item_id: int
    location_id: int
    quantity: int
