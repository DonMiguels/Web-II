normalizeLegacyBoNaming:
  query: |
    DO $$
    DECLARE
      v_subsystem TEXT;
      v_old_class TEXT;
      v_new_class TEXT;
      v_old_method TEXT;
      v_new_method TEXT;
      v_subsystem_id BIGINT;
      v_class_id BIGINT;
      v_old_class_id BIGINT;
      v_new_class_id BIGINT;
      v_old_method_id BIGINT;
      v_new_method_id BIGINT;
    BEGIN
      FOR v_subsystem, v_old_class, v_new_class IN
        SELECT * FROM (
          VALUES
            ('Inventory', 'Equipo', 'Equipment'),
            ('Inventory', 'Ubicacion', 'Location'),
            ('Inventory', 'EstadoEquipo', 'EquipmentStatus'),
            ('Loans', 'Prestamo', 'Loan')
        ) AS class_map(subsystem_name, old_class_name, new_class_name)
      LOOP
        SELECT s.id INTO v_subsystem_id
        FROM public.subsystem s
        WHERE LOWER(s.name) = LOWER(v_subsystem)
        LIMIT 1;

        IF v_subsystem_id IS NULL THEN
          CONTINUE;
        END IF;

        SELECT c.id INTO v_old_class_id
        FROM public."class" c
        JOIN public.subsystem_class sc ON sc.class_id = c.id
        WHERE sc.subsystem_id = v_subsystem_id
          AND LOWER(c.name) = LOWER(v_old_class)
        LIMIT 1;

        IF v_old_class_id IS NULL THEN
          CONTINUE;
        END IF;

        SELECT c.id INTO v_new_class_id
        FROM public."class" c
        JOIN public.subsystem_class sc ON sc.class_id = c.id
        WHERE sc.subsystem_id = v_subsystem_id
          AND LOWER(c.name) = LOWER(v_new_class)
        LIMIT 1;

        IF v_new_class_id IS NULL THEN
          UPDATE public."class"
          SET name = v_new_class
          WHERE id = v_old_class_id;
          v_new_class_id := v_old_class_id;
        ELSE
          INSERT INTO public.subsystem_class (subsystem_id, class_id)
          VALUES (v_subsystem_id, v_new_class_id)
          ON CONFLICT (subsystem_id, class_id) DO NOTHING;

          INSERT INTO public.class_method (class_id, method_id)
          SELECT v_new_class_id, cm.method_id
          FROM public.class_method cm
          WHERE cm.class_id = v_old_class_id
          ON CONFLICT (class_id, method_id) DO NOTHING;

          INSERT INTO public."transaction" (subsystem_id, class_id, method_id)
          SELECT t.subsystem_id, v_new_class_id, t.method_id
          FROM public."transaction" t
          WHERE t.class_id = v_old_class_id
          ON CONFLICT (subsystem_id, class_id, method_id) DO NOTHING;

          DELETE FROM public."transaction" WHERE class_id = v_old_class_id;
          DELETE FROM public.class_method WHERE class_id = v_old_class_id;
          DELETE FROM public.subsystem_class WHERE class_id = v_old_class_id;
          DELETE FROM public."class" WHERE id = v_old_class_id;
        END IF;
      END LOOP;

      FOR v_subsystem, v_new_class, v_old_method, v_new_method IN
        SELECT * FROM (
          VALUES
            ('Inventory', 'Equipment', 'createEquipo', 'createEquipment'),
            ('Inventory', 'Equipment', 'getEquipoById', 'getEquipmentById'),
            ('Inventory', 'Equipment', 'getEquipoByCodigo', 'getEquipmentByCode'),
            ('Inventory', 'Equipment', 'getAllEquipos', 'getAllEquipment'),
            ('Inventory', 'Equipment', 'updateEquipo', 'updateEquipment'),
            ('Inventory', 'Equipment', 'deleteEquipo', 'deleteEquipment'),
            ('Inventory', 'Location', 'createUbicacion', 'createLocation'),
            ('Inventory', 'Location', 'getUbicacionById', 'getLocationById'),
            ('Inventory', 'Location', 'getUbicacionByNombre', 'getLocationByName'),
            ('Inventory', 'Location', 'getAllUbicaciones', 'getAllLocations'),
            ('Inventory', 'Location', 'updateUbicacion', 'updateLocation'),
            ('Inventory', 'Location', 'deleteUbicacion', 'deleteLocation'),
            ('Inventory', 'EquipmentStatus', 'createEstadoEquipo', 'createEquipmentStatus'),
            ('Inventory', 'EquipmentStatus', 'getEstadoEquipoById', 'getEquipmentStatusById'),
            ('Inventory', 'EquipmentStatus', 'getEstadoEquipoByNombre', 'getEquipmentStatusByName'),
            ('Inventory', 'EquipmentStatus', 'getAllEstadosEquipo', 'getAllEquipmentStatuses'),
            ('Inventory', 'EquipmentStatus', 'updateEstadoEquipo', 'updateEquipmentStatus'),
            ('Inventory', 'EquipmentStatus', 'deleteEstadoEquipo', 'deleteEquipmentStatus'),
            ('Loans', 'Loan', 'createPrestamo', 'createLoan'),
            ('Loans', 'Loan', 'getPrestamoById', 'getLoanById'),
            ('Loans', 'Loan', 'getPrestamosByUsuario', 'getLoansByUser'),
            ('Loans', 'Loan', 'getPrestamosByEquipo', 'getLoansByEquipment'),
            ('Loans', 'Loan', 'getAllPrestamos', 'getAllLoans'),
            ('Loans', 'Loan', 'getPrestamosActivos', 'getActiveLoans'),
            ('Loans', 'Loan', 'updatePrestamo', 'updateLoan'),
            ('Loans', 'Loan', 'deletePrestamo', 'deleteLoan')
        ) AS method_map(subsystem_name, class_name, old_method_name, new_method_name)
      LOOP
        SELECT s.id INTO v_subsystem_id
        FROM public.subsystem s
        WHERE LOWER(s.name) = LOWER(v_subsystem)
        LIMIT 1;

        IF v_subsystem_id IS NULL THEN
          CONTINUE;
        END IF;

        SELECT c.id INTO v_class_id
        FROM public."class" c
        JOIN public.subsystem_class sc ON sc.class_id = c.id
        WHERE sc.subsystem_id = v_subsystem_id
          AND LOWER(c.name) = LOWER(v_new_class)
        LIMIT 1;

        IF v_class_id IS NULL THEN
          CONTINUE;
        END IF;

        SELECT m.id INTO v_old_method_id
        FROM public."method" m
        JOIN public.class_method cm ON cm.method_id = m.id
        WHERE cm.class_id = v_class_id
          AND LOWER(m.name) = LOWER(v_old_method)
        LIMIT 1;

        IF v_old_method_id IS NULL THEN
          CONTINUE;
        END IF;

        SELECT m.id INTO v_new_method_id
        FROM public."method" m
        JOIN public.class_method cm ON cm.method_id = m.id
        WHERE cm.class_id = v_class_id
          AND LOWER(m.name) = LOWER(v_new_method)
        LIMIT 1;

        IF v_new_method_id IS NULL THEN
          UPDATE public."method"
          SET name = v_new_method
          WHERE id = v_old_method_id;
          v_new_method_id := v_old_method_id;
        ELSE
          INSERT INTO public.class_method (class_id, method_id)
          VALUES (v_class_id, v_new_method_id)
          ON CONFLICT (class_id, method_id) DO NOTHING;

          INSERT INTO public.method_profile (method_id, profile_id)
          SELECT v_new_method_id, mp.profile_id
          FROM public.method_profile mp
          WHERE mp.method_id = v_old_method_id
          ON CONFLICT (method_id, profile_id) DO NOTHING;

          INSERT INTO public."transaction" (subsystem_id, class_id, method_id)
          SELECT t.subsystem_id, t.class_id, v_new_method_id
          FROM public."transaction" t
          WHERE t.method_id = v_old_method_id
          ON CONFLICT (subsystem_id, class_id, method_id) DO NOTHING;

          DELETE FROM public."transaction" WHERE method_id = v_old_method_id;
          DELETE FROM public.method_profile WHERE method_id = v_old_method_id;
          DELETE FROM public.class_method WHERE method_id = v_old_method_id;
          DELETE FROM public."method" WHERE id = v_old_method_id;
        END IF;
      END LOOP;
    END;
    $$;
  structure_params: {}
  orderArray: []
getPermissions:
  query: SELECT DISTINCT s.name AS subsystem, c.name AS class_name, m.name AS method_name, p.name AS profile_name FROM public.method_profile mp JOIN public.method m ON m.id = mp.method_id JOIN public.class_method cm ON cm.method_id = m.id JOIN public."class" c ON c.id = cm.class_id JOIN public.subsystem_class sc ON sc.class_id = c.id JOIN public.subsystem s ON s.id = sc.subsystem_id JOIN public.profile p ON p.id = mp.profile_id ORDER BY s.name, c.name, m.name, p.name;
  structure_params: {}
  orderArray: []
getTransactionRoutes:
  query: SELECT t.id AS transaction_id, s.name AS subsystem, c.name AS class_name, m.name AS method_name FROM public."transaction" t JOIN public.subsystem s ON s.id = t.subsystem_id JOIN public."class" c ON c.id = t.class_id JOIN public."method" m ON m.id = t.method_id ORDER BY t.id;
  structure_params: {}
  orderArray: []
ensureTransactionSerial:
  query: SELECT 1;
  structure_params: {}
  orderArray: []
insertPermission:
  query: WITH ins_subsystem AS (INSERT INTO public.subsystem (name) SELECT $1::text WHERE NOT EXISTS (SELECT 1 FROM public.subsystem WHERE name = $1::text) RETURNING id), sel_subsystem AS (SELECT id FROM ins_subsystem UNION ALL SELECT id FROM public.subsystem WHERE name = $1::text ORDER BY id LIMIT 1), ins_class AS (INSERT INTO public."class" (name) SELECT $2::text WHERE NOT EXISTS (SELECT 1 FROM public."class" WHERE name = $2::text) RETURNING id), sel_class AS (SELECT id FROM ins_class UNION ALL SELECT id FROM public."class" WHERE name = $2::text ORDER BY id LIMIT 1), link_subsystem_class AS (INSERT INTO public.subsystem_class (subsystem_id, class_id) SELECT s.id, c.id FROM sel_subsystem s CROSS JOIN sel_class c ON CONFLICT (subsystem_id, class_id) DO NOTHING), ins_method AS (INSERT INTO public."method" (name) SELECT $3::text WHERE NOT EXISTS (SELECT 1 FROM public."method" WHERE name = $3::text) RETURNING id), sel_method AS (SELECT id FROM ins_method UNION ALL SELECT id FROM public."method" WHERE name = $3::text ORDER BY id LIMIT 1), link_class_method AS (INSERT INTO public.class_method (class_id, method_id) SELECT c.id, m.id FROM sel_class c CROSS JOIN sel_method m ON CONFLICT (class_id, method_id) DO NOTHING), ins_profile AS (INSERT INTO public.profile (name) SELECT $4::text WHERE NOT EXISTS (SELECT 1 FROM public.profile WHERE name = $4::text) RETURNING id), sel_profile AS (SELECT id FROM ins_profile UNION ALL SELECT id FROM public.profile WHERE name = $4::text ORDER BY id LIMIT 1), link_method_profile AS (INSERT INTO public.method_profile (method_id, profile_id) SELECT m.id, p.id FROM sel_method m CROSS JOIN sel_profile p ON CONFLICT (method_id, profile_id) DO NOTHING), ins_transaction AS (INSERT INTO public."transaction" (subsystem_id, class_id, method_id) SELECT s.id, c.id, m.id FROM sel_subsystem s CROSS JOIN sel_class c CROSS JOIN sel_method m WHERE NOT EXISTS (SELECT 1 FROM public."transaction" t WHERE t.method_id = m.id AND t.class_id = c.id AND t.subsystem_id = s.id)) SELECT s.id AS subsystem_id, c.id AS class_id, m.id AS method_id, p.id AS profile_id FROM sel_subsystem s CROSS JOIN sel_class c CROSS JOIN sel_method m CROSS JOIN sel_profile p;
  structure_params:
    subsystem: string
    class_name: string
    method_name: string
    profile_name: string
  orderArray:
    - subsystem
    - class_name
    - method_name
    - profile_name
