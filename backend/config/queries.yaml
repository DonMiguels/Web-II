# NEGOCIO: Loan
# ============================================================
insertLoan:
  query: INSERT INTO public.loan (borrower_user_id, processed_by_user_id, status_id, booked_at, due_at, observations) VALUES ($1, NULLIF($2, 0), $3, $4::timestamptz, $5::timestamptz, NULLIF($6, '')) RETURNING *;
  structure_params:
    borrower_user_id: int
    processed_by_user_id: int
    status_id: int
    booked_at: string
    due_at: string
    observations: string
  orderArray:
    - borrower_user_id
    - processed_by_user_id
    - status_id
    - booked_at
    - due_at
    - observations
updateLoan:
  query: UPDATE public.loan SET due_at = $2, observations = $3, status_id = $4, updated_at = NOW() WHERE id = $1 RETURNING *;
  structure_params:
    id: int
    due_at: string
    observations: string
    status_id: int
  orderArray:
    - id
    - due_at
    - observations
    - status_id
getLoanById:
  query: SELECT l.*, ls.name AS status_name, ub.name AS borrower_username, up.name AS processed_by_username FROM public.loan l JOIN public.loan_status ls ON ls.id = l.status_id JOIN public."user" ub ON ub.id = l.borrower_user_id LEFT JOIN public."user" up ON up.id = l.processed_by_user_id WHERE l.id = $1;
  structure_params:
    id: int
  orderArray:
    - id
getAllLoans:
  query: SELECT l.*, ls.name AS status_name, ub.name AS borrower_username FROM public.loan l JOIN public.loan_status ls ON ls.id = l.status_id JOIN public."user" ub ON ub.id = l.borrower_user_id ORDER BY l.id DESC;
  structure_params: {}
  orderArray: []
getLoansByUser:
  query: SELECT l.*, ls.name AS status_name FROM public.loan l JOIN public.loan_status ls ON ls.id = l.status_id WHERE l.borrower_user_id = $1 ORDER BY l.id DESC;
  structure_params:
    borrower_user_id: int
  orderArray:
    - borrower_user_id
getActiveLoans:
  query: SELECT l.*, ls.name AS status_name, ub.name AS borrower_username FROM public.loan l JOIN public.loan_status ls ON ls.id = l.status_id JOIN public."user" ub ON ub.id = l.borrower_user_id WHERE ls.name IN ('active', 'reserved', 'overdue') ORDER BY l.due_at;
  structure_params: {}
  orderArray: []
getLoanItemsByLoan:
  query: SELECT li.*, i.code AS item_code, i.name AS item_name, i.brand, i.model, st.location_id, loc.name AS location_name, cond.name AS return_condition_name FROM public.loan_item li JOIN public.stock st ON st.id = li.stock_id JOIN public.item i ON i.id = st.item_id JOIN public.location loc ON loc.id = st.location_id LEFT JOIN public.item_condition cond ON cond.id = li.return_condition_id WHERE li.loan_id = $1 ORDER BY li.id;
  structure_params:
    loan_id: int
  orderArray:
    - loan_id

