    id: int
  orderArray:
    - id
getAllStock:
  query: SELECT st.*, i.code AS item_code, i.name AS item_name, i.brand, i.model, c.name AS category_name, l.name AS location_name FROM public.stock st JOIN public.item i ON i.id = st.item_id JOIN public.item_category c ON c.id = i.category_id JOIN public.location l ON l.id = st.location_id WHERE i.deleted_at IS NULL AND l.deleted_at IS NULL ORDER BY st.id;
  structure_params: {}
  orderArray: []
getStockByItem:
  query: SELECT st.*, l.name AS location_name FROM public.stock st JOIN public.location l ON l.id = st.location_id WHERE st.item_id = $1 ORDER BY st.id;
  structure_params:
    item_id: int
  orderArray:
